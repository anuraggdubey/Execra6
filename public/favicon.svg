<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <rect width="64" height="64" rx="14" stroke="#1e293b" stroke-width="1.5"/>
  <g transform="translate(4, 4)">
    <defs>
      <linearGradient id="execra-grad-1" x1="12" y1="12" x2="38" y2="44" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#2563eb"/>
      </linearGradient>
      <linearGradient id="execra-grad-2" x1="22" y1="12" x2="48" y2="44" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#60a5fa"/>
        <stop offset="100%" stop-color="#1d4ed8"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.5" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    <!-- Left Orbital Ring -->
    <circle cx="22.5" cy="28" r="14.5" stroke="url(#execra-grad-1)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Right Orbital Ring -->
    <circle cx="33.5" cy="28" r="14.5" stroke="url(#execra-grad-2)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Satellite Pulse Dot -->
    <circle cx="41.5" cy="17.5" r="4.2" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="41.5" cy="17.5" r="3" fill="#ffffff"/>
  </g>
</svg>
